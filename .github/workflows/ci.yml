name: Offline host software

# All tests use fake devices or synthetic data. No firmware build, register-file
# generation, hardware enumeration, live acquisition or analysis campaign runs here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host, GUI and HDF5 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: Software/Python
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install host and offline test dependencies
        # The dev extra provides Qt and HDF5 so their regressions cannot silently
        # disappear. Driver packages are installed, but tests never open devices.
        # The live-capture extra (ChipWhisperer) is intentionally not installed.
        run: python -m pip install --upgrade pip "numpy<2" flake8 -e "./Software/Python[dev]"
      - name: Verify GUI and HDF5 coverage is available
        run: python -c "import h5py; from PyQt6.QtWidgets import QApplication; print('Qt and HDF5 available')"
      - name: Offline regression suite, warnings as errors
        run: python -m pytest -W error --junitxml="${RUNNER_TEMP}/host-tests.xml"
      - name: Install offline configuration UI dependencies
        run: python -m pip install -r Acquisition/requirements.txt
      - name: Offline frequency wizard, progress and setup regressions
        run: PYTHONPATH=Acquisition python -m pytest Acquisition/acq/tests -W error
      - name: Critical Python name and argument errors
        run: python -m flake8 --select=F821,F822,F823,F831 Software/Python Software/GUI/proact_gui.py tests Acquisition
      - name: GUI layout regression guard
        run: python tools/check_gui_layout.py
      - name: Render disconnected GUI pages
        run: python tools/gen_gui_screenshots.py "${RUNNER_TEMP}/gui-shots"
      - name: Generated Python registers match configuration without writing files
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("scripts/gen_hardware.py")
          spec = importlib.util.spec_from_file_location("register_generator", path)
          generator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(generator)
          actual = Path("Software/Python/proact_host/regs.py").read_text()
          assert generator.gen_py(generator.load()) == actual
          PY
      - name: CLI reference is current
        run: |
          python tools/generate_cli_reference.py
          git diff --exit-code -- docs/CLI_REFERENCE.md
      - name: Shell scripts parse
        shell: bash
        run: |
          for script in run_gui.sh run_cli.sh tools/*.sh; do
            bash -n "$script"
          done
      - name: Check whitespace
        run: git diff --check
