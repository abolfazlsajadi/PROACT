<text x="700.0" y="36" font-size="21" font-weight="800" text-anchor="middle" fill="#f8fafc">PROACT Evaluation Board — Clock Tree (J12 clock-source select)</text>
<text x="700.0" y="58" font-size="11.5" font-weight="600" text-anchor="middle" fill="#94a3b8">One net — CLK_pin — feeds SYSCLK_P. Fit exactly ONE J12 source link: 1-2 SMA · 3-4 on-board 50 MHz · 5-6 ChipWhisperer. The running clock is always echoed to the CW on J7.5.</text>
