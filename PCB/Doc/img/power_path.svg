<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker><marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker><marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b"/></marker></defs>
<text x="700.0" y="34" font-size="21" font-weight="800" text-anchor="middle" fill="#f8fafc">PROACT Evaluation Board — Core Power &amp; Current-Sense Path</text>
<text x="700.0" y="56" font-size="11.5" font-weight="600" text-anchor="middle" fill="#94a3b8">VDDIO 3.3 V (CW308 J8.14) → U2 TPS74801 trimmed to 0.8 V → JP7 route select (direct or CW308-filtered) → R7 0.01 Ω shunt → PROACT die (pins 15 &amp; 28) — the CW308 captures the power trace across R7.</text>
<rect x="30" y="385" width="150" height="100" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
<text x="105" y="414" font-size="14" font-weight="800" text-anchor="middle" fill="#f1f5f9">VDDIO · 3.3 V</text>
<text x="105" y="436" font-size="9.5" font-weight="600" text-anchor="middle" fill="#fdba74">from CW308 J8.14</text>
<text x="105" y="452" font-size="8.5" font-weight="600" text-anchor="middle" fill="#94a3b8">also J7.20 VREF · J9.12</text>
<text x="105" y="468" font-size="8" font-weight="600" text-anchor="middle" fill="#94a3b8">CW308 supplies the board</text>
<line x1="105" y1="383" x2="105" y2="347" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<text x="105" y="320" font-size="9" font-weight="600" text-anchor="middle" fill="#94a3b8">also feeds: chip VDDIO pins 7/22,</text>
<text x="105" y="334" font-size="9" font-weight="600" text-anchor="middle" fill="#94a3b8">USB bridges (DIP S1-6/7) · pull-ups</text>
<rect x="230" y="385" width="180" height="100" rx="10" fill="#3f1d0b" stroke="#b45309" stroke-width="2"/>
<text x="320" y="414" font-size="15" font-weight="800" text-anchor="middle" fill="#f1f5f9">U2 — TPS74801</text>
<text x="320" y="434" font-size="9.5" font-weight="600" text-anchor="middle" fill="#94a3b8">LDO · IN / BIAS / EN = VDDIO</text>
<text x="320" y="450" font-size="9.5" font-weight="600" text-anchor="middle" fill="#94a3b8">soft-start: C18 10 nF · PG: n/c</text>
<text x="320" y="470" font-size="9" font-weight="700" text-anchor="middle" fill="#fdba74">FB ← trim network (below)</text>
