<text x="945" y="730" font-size="9.5" font-weight="600" text-anchor="middle" fill="#94a3b8">R7 = 0.01 Ω → 1 mA of core current = 10 µV of signal · die-side rail is deliberately capacitor-free so the shunt sees the instantaneous die current</text>
