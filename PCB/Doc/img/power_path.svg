<text x="300" y="576" font-size="9.5" font-weight="700" text-anchor="start" fill="#e2e8f0">R20 1 k multi-turn trimmer</text>
<text x="300" y="590" font-size="8.5" font-weight="600" text-anchor="start" fill="#94a3b8">(wiper = FB, strapped to 3rd terminal)</text>
<text x="300" y="604" font-size="9.5" font-weight="700" text-anchor="start" fill="#e2e8f0">R21 8.2 k → GND</text>
<text x="300" y="622" font-size="9" font-weight="600" text-anchor="start" fill="#94a3b8">VOUT = 0.8 × (1 + R20 / 8.2 k)</text>
<text x="300" y="636" font-size="9" font-weight="600" text-anchor="start" fill="#94a3b8">= 0.80 – 0.90 V adjustable</text>
<rect x="212" y="652" width="256" height="36" rx="8" fill="#450a0a" fill-opacity="0.6" stroke="#f87171" stroke-width="1.2"/>
<text x="340" y="666" font-size="9.5" font-weight="800" text-anchor="middle" fill="#fecaca">SET 0.8 V BEFORE INSERTING THE CHIP</text>
<text x="340" y="681" font-size="8.5" font-weight="600" text-anchor="middle" fill="#fca5a5">trim R20 · measure Vcore TP · JP7 at 2-3</text>
