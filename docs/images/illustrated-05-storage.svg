<rect x="963" y="402" width="172" height="106" rx="16" fill="#e1f4ef" stroke="none" stroke-width="2"/>
<text x="1049" y="446" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">Chunk 2</text>
<text x="1049" y="481" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">committed</text>
<rect x="1161" y="402" width="172" height="106" rx="16" fill="#fff5e7" stroke="none" stroke-width="2"/>
<text x="1247" y="446" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">Pending</text>
<text x="1247" y="481" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#52647b" font-weight="400" text-anchor="middle">in memory</text>
<rect x="765" y="547" width="370" height="100" rx="16" fill="#e1f4ef" stroke="none" stroke-width="2"/>
<text x="785" y="588" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#087f80" font-weight="700" text-anchor="start">Published manifest</text>
<text x="785" y="622" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#52647b" font-weight="400" text-anchor="start">Names committed chunks only</text>
<polyline points="850,547 850,508" fill="none" stroke="#087f80" stroke-width="3" stroke-linejoin="round"/>
<polyline points="856.0,520.0 850,508 844.0,520.0" fill="none" stroke="#087f80" stroke-width="3"/>
<polyline points="1037,547 1037,508" fill="none" stroke="#087f80" stroke-width="3" stroke-linejoin="round"/>
<polyline points="1043.0,520.0 1037,508 1031.0,520.0" fill="none" stroke="#087f80" stroke-width="3"/>
<text x="68" y="565" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#52647b" font-weight="400" text-anchor="start">After interruption, inspect the latest</text>
<text x="68" y="599" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#52647b" font-weight="400" text-anchor="start">published snapshot and its row count.</text>
<text x="68" y="633" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#52647b" font-weight="400" text-anchor="start">That file is the recovery point.</text>
<text x="1170" y="556" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#a6630a" font-weight="400" text-anchor="start">Not yet</text>
<text x="1170" y="587" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#a6630a" font-weight="400" text-anchor="start">published</text>
<text x="1170" y="618" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#a6630a" font-weight="400" text-anchor="start">Can be lost</text>
<rect x="44" y="704" width="1352" height="128" rx="16" fill="#f3f6fb" stroke="none" stroke-width="2"/>
<text x="69" y="745" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">Recovery is not automatic resume</text>
<text x="69" y="786" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#52647b" font-weight="400" text-anchor="start">Keep the complete dataset, read its failure records, and start a new output for a later acquisition.</text>
<text x="44" y="882" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647b" font-weight="400" text-anchor="start">PROACT host guide  •  Explanatory diagram; no measured waveform or physical pin map</text>
</svg>
