<polyline points="474.0,552.0 462,558 474.0,564.0" fill="none" stroke="#a6630a" stroke-width="3"/>
<rect x="44" y="724" width="1352" height="118" rx="16" fill="#f3f6fb" stroke="none" stroke-width="2"/>
<text x="69" y="766" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#172b4d" font-weight="700" text-anchor="start">Three independent results</text>
<text x="69" y="807" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#52647b" font-weight="400" text-anchor="start">Software check passed  ≠  board responded  ≠  waveform and output validated</text>
<text x="44" y="891" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647b" font-weight="400" text-anchor="start">PROACT host guide  •  Explanatory diagram; no measured waveform or physical pin map</text>
