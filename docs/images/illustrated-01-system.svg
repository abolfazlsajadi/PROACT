<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Where commands and measurements travel</title><desc id="desc">A host uses MCP2210 SPI for controller programming and MCP2200 UART for commands. The controller selects a hardware accelerator or the second Ibex software target. Husky receives separate trigger and analog measurement paths and returns samples to the host.</desc>
