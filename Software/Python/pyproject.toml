[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proact-host"
version = "1.1.0.dev1"
description = "Host-side control, capture and tooling for the PROACT lightweight-crypto RISC-V SoC (ASIC + FPGA)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "pyserial>=3.5",
    "hidapi>=0.14",
    "mcp2210-python==1.0.4",
    "numpy>=1.23",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
hdf5 = ["h5py>=3.7"]
capture = ["chipwhisperer==6.0.0"]
dev = ["pytest>=7", "h5py>=3.7", "PyQt6>=6.5"]
all = ["PyQt6>=6.5", "h5py>=3.7", "chipwhisperer==6.0.0"]

[project.scripts]
proact = "proact_host.cli:main"

[tool.setuptools]
packages = ["proact_host"]
py-modules = ["proact_cli", "measure"]
