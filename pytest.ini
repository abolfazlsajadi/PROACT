# PROACT host-library regression tests.
#
# This file lives at the repo root (not in Software/Python/pyproject.toml) on
# purpose: the tests live in <repo>/tests while the packaging metadata lives one
# level down in Software/Python/. A [tool.pytest.ini_options] block there would
# only be picked up when pytest is invoked from inside Software/Python, and its
# `testpaths` would resolve against that directory instead of the repo root.
# Keeping the pytest config here also keeps the distribution metadata untouched.
#
# The suite is OFFLINE ONLY -- no serial port, no MCP2210/MCP2200, no
# ChipWhisperer, no network, no board. See tests/README.md.
#
#   ./tools/run_tests.sh              # everything
#   ./tools/run_tests.sh -k aead      # one area
#   ./tools/run_tests.sh -x -vv       # first failure, verbose

[pytest]
minversion = 7.0
testpaths = tests

# -q          quiet progress, one line per file
# -ra         summarise every non-passing outcome (xfail/skip reasons) at the end
# --strict-markers / --strict-config  typos in markers or ini keys are errors,
#             not silently ignored
addopts = -q -ra --strict-markers --strict-config --tb=short

# An xfail that starts passing is a signal that a product bug got fixed and the
# marker should come off, so make it fail loudly unless a test opts out with an
# explicit strict=False (the flaky/environment-dependent ones already do).
xfail_strict = true

# tests/conftest.py also does this, so `pytest` works even without this file.
pythonpath = Software/Python
